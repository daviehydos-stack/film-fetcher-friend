name: Deploy GitHub Pages Preview
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stamp preview build
        run: printf '{"sha":"%s"}\n' "$GITHUB_SHA" > public/version.json
      - name: Build static TanStack preview
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          # GitHub Pages is a preview mirror, not a second search-index target.
          VITE_PUBLIC_SITE_URL: https://avantmovies.vercel.app
        run: bun run build
      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -e
          test -f .output/public/index.html
          cat > .output/public/404.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><script>(function(){var base="/film-fetcher-friend";var p=location.pathname.startsWith(base)?location.pathname.slice(base.length):location.pathname;location.replace(base+"/?__spa="+encodeURIComponent(p+location.search+location.hash))})();</script></head><body></body></html>
          EOF
          touch .output/public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
