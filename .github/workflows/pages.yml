name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_PAGES: "true"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stamp deployed version
        run: printf '{"sha":"%s"}\n' "$GITHUB_SHA" > public/version.json
      - name: Build GitHub Pages site
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_PUBLIC_SITE_URL: https://avantcinematic.com
        run: bun run build
      - name: Prepare SPA fallback
        shell: bash
        run: |
          set -euo pipefail
          test -f .output/public/index.html
          printf 'avantcinematic.com\n' > .output/public/CNAME
          cat > .output/public/404.html <<'EOF'
          <!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><script>(function(){var p=location.pathname;location.replace("/?__spa="+encodeURIComponent(p+location.search+location.hash))})();</script></head><body></body></html>
          EOF
          touch .output/public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
