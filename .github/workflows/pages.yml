name: Deploy GitHub Pages Preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare static Pages artifact
        shell: bash
        run: |
          set -e
          rm -rf pages-dist
          mkdir -p pages-dist

          if [ -d ".output/public" ]; then
            cp -R .output/public/. pages-dist/
          elif [ -d "dist/client" ]; then
            cp -R dist/client/. pages-dist/
          elif [ -d "dist" ]; then
            cp -R dist/. pages-dist/
          else
            echo "No static client build directory found."
            exit 1
          fi

          CSS_FILE="$(find pages-dist/assets -maxdepth 1 -type f -name 'styles-*.css' -printf '%f\n' | head -n 1)"
          JS_FILE="$(find pages-dist/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%f\n' | head -n 1)"

          if [ -z "$CSS_FILE" ] || [ -z "$JS_FILE" ]; then
            echo "Could not locate generated client entry assets."
            find pages-dist -maxdepth 2 -type f | sort
            exit 1
          fi

          {
            echo '<!doctype html>'
            echo '<html lang="en">'
            echo '<head>'
            echo '  <meta charset="UTF-8" />'
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1.0" />'
            echo '  <title>Avant Movies</title>'
            printf '  <link rel="stylesheet" href="./assets/%s" />\n' "$CSS_FILE"
            echo '</head>'
            echo '<body>'
            echo '  <div id="root"></div>'
            printf '  <script type="module" src="./assets/%s"></script>\n' "$JS_FILE"
            echo '</body>'
            echo '</html>'
          } > pages-dist/index.html

          cp pages-dist/index.html pages-dist/404.html
          touch pages-dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
