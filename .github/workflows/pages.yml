name: Deploy GitHub Pages Preview

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Prepare static Pages artifact
        shell: bash
        run: |
          set -e
          rm -rf pages-dist
          mkdir -p pages-dist

          if [ -d ".output/public" ]; then
            cp -R .output/public/. pages-dist/
          elif [ -d "dist/client" ]; then
            cp -R dist/client/. pages-dist/
          elif [ -d "dist" ]; then
            cp -R dist/. pages-dist/
          else
            echo "No static client build directory found."
            find . -maxdepth 3 -type d | sort
            exit 1
          fi

          # TanStack Start normally renders the HTML shell through its server.
          # GitHub Pages is static-only, so guarantee an index.html exists for the preview.
          if [ ! -f "pages-dist/index.html" ]; then
            cat > pages-dist/index.html <<'EOF'
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avant Movies</title>
  <link rel="stylesheet" href="./assets/styles-yhSLaQu4.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./assets/index-CR4JuI1a.js"></script>
</body>
</html>
EOF
          fi

          # SPA fallback for direct links in the static preview.
          cp pages-dist/index.html pages-dist/404.html
          touch pages-dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
