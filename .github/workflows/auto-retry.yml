name: Auto Retry Failed Workflows

on:
  workflow_run:
    workflows:
      - Avant Movies CI
      - Deploy GitHub Pages Preview
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  retry:
    # Retry genuine failures only. Never create an infinite retry loop.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 }}
    runs-on: ubuntu-latest
    steps:
      - name: Retry failed workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: gh run rerun "$RUN_ID" --repo "$REPOSITORY"
