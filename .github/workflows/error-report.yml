name: Compile Workflow Error Report

on:
  workflow_run:
    workflows:
      - Avant Movies CI
      - Deploy GitHub Pages Preview
      - Auto Retry Failed Workflows
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional workflow run ID to diagnose"
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: workflow-error-report
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic history
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compile current and historical errors
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        shell: bash
        run: |
          set -uo pipefail
          RUN_ID="${MANUAL_RUN_ID:-$EVENT_RUN_ID}"
          mkdir -p diagnostics
          touch diagnostics/workflow-error-history.md

          gh run view "$RUN_ID" --repo "$REPOSITORY" --json databaseId,name,displayTitle,headSha,status,conclusion,attempt,createdAt,updatedAt,url,jobs > diagnostics/run.json || echo '{}' > diagnostics/run.json
          gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed > diagnostics/failed.log 2>&1 || true

          {
            echo
            echo "---"
            echo
            echo "## Failure recorded $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "### Run metadata"
            echo '~~~json'
            cat diagnostics/run.json
            echo
            echo '~~~'
            echo
            echo "### Primary errors"
            echo '~~~text'
            grep -Ei '(^|[^a-z])(error|fatal|syntaxerror|typeerror|referenceerror|failed|exit code|unexpected token)([^a-z]|$)' diagnostics/failed.log | awk '!seen[$0]++' | head -n 250 || true
            echo '~~~'
            echo
            echo "### Full failed-step log"
            echo '~~~text'
            cat diagnostics/failed.log
            echo '~~~'
          } >> diagnostics/workflow-error-history.md

          {
            echo "# Avant Movies — Workflow Error Monitor"
            echo
            echo "This repository file keeps previous and current workflow failures together."
            echo
            echo "## Current failure"
            echo
            echo "Run ID: $RUN_ID"
            echo
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "### Current primary errors"
            echo '~~~text'
            grep -Ei '(^|[^a-z])(error|fatal|syntaxerror|typeerror|referenceerror|failed|exit code|unexpected token)([^a-z]|$)' diagnostics/failed.log | awk '!seen[$0]++' | head -n 250 || true
            echo '~~~'
            echo
            echo "## Previous + current error history"
            cat diagnostics/workflow-error-history.md
          } > diagnostics/workflow-error-report.md

          cat diagnostics/workflow-error-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save report history to repository
        shell: bash
        run: |
          if git diff --quiet -- diagnostics/workflow-error-history.md diagnostics/workflow-error-report.md; then
            exit 0
          fi
          git config user.name "avant-workflow-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/workflow-error-history.md diagnostics/workflow-error-report.md
          git commit -m "chore: update workflow error monitor [skip ci]"
          git push origin HEAD:main

      - name: Upload single diagnostic file
        uses: actions/upload-artifact@v4
        with:
          name: workflow-error-report-${{ github.run_id }}
          path: diagnostics/workflow-error-report.md
          if-no-files-found: error
          retention-days: 30

# The report is also committed to diagnostics/workflow-error-report.md for direct repository visibility.
