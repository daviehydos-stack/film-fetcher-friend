name: Format failing files
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format files reported by CI
        run: |
          bunx prettier --write             scripts/generate-seo.mjs             src/components/admin/VimeoSettings.tsx             src/components/site/PageShell.tsx             src/components/site/Pricing.tsx             src/components/site/SiteFooter.tsx             src/components/site/SiteHeader.tsx             src/components/streaming/CataloguePage.tsx             src/components/streaming/ContentRail.tsx             src/components/streaming/ContinueWatching.tsx             src/components/streaming/HomeHero.tsx             src/components/streaming/StreamingShell.tsx             src/components/streaming/TitleCard.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-seo.mjs src/components
          git commit -m "style: fix CI formatting failures"
          git push
